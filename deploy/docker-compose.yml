# Deploy produksi di VPS: docker compose up -d --build
# Jalankan dari folder deploy/ ini.
# Pastikan file .env sudah ada (salin dari ../.env.example)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gudang
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD di file .env}
      POSTGRES_DB: gudang
    volumes:
      - dbdata:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.13
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY di file .env}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    ports:
      - "127.0.0.1:7700:7700"

  api:
    build: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gudang:${DB_PASSWORD}@db:5432/gudang
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET di file .env}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      PORT: 4000
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - meilisearch
    ports:
      - "127.0.0.1:4000:4000"

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    environment:
      CB_DB_URL: "postgresql://gudang:${DB_PASSWORD}@db:5432/gudang"
      CB_ADMIN_NAME: admin
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_PASSWORD:?set CLOUDBEAVER_PASSWORD di file .env}
    depends_on:
      - db
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaverdata:/opt/cloudbeaver/workspace

volumes:
  dbdata:
  uploads:
  meilidata:
  cloudbeaverdata:
